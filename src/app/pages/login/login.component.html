<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl border border-gray-100">
    <div>
      <h2 class="mt-2 text-center text-3xl font-extrabold text-gray-900 font-outfit">
        {{ isLogin() ? 'Connexion' : 'Créer un compte' }}
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        {{ isLogin() ? 'Ou' : 'Déjà un compte ?' }}
        <button (click)="toggleMode()" class="font-medium text-blue-600 hover:text-blue-500 transition-colors">
          {{ isLogin() ? 'créez un compte gratuitement' : 'connectez-vous ici' }}
        </button>
      </p>
    </div>

    <form class="mt-8 space-y-6" (ngSubmit)="onSubmit()">
      @if (error()) {
        <div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm text-center border border-red-100">
          {{ error() }}
        </div>
      }

      <div class="space-y-4">
        @if (!isLogin()) {
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="firstName" class="sr-only">Prénom</label>
              <input id="firstName" name="firstName" type="text" [(ngModel)]="formData.firstName" required
                     class="input-field w-full" placeholder="Prénom">
            </div>
            <div>
              <label for="lastName" class="sr-only">Nom</label>
              <input id="lastName" name="lastName" type="text" [(ngModel)]="formData.lastName" required
                     class="input-field w-full" placeholder="Nom">
            </div>
          </div>
        }

        <div>
          <label for="email-address" class="sr-only">Adresse email</label>
          <input id="email-address" name="email" type="email" autocomplete="email" [(ngModel)]="formData.email" required
                 class="input-field w-full" placeholder="Adresse email">
        </div>
        
        <div>
          <label for="password" class="sr-only">Mot de passe</label>
          <input id="password" name="password" type="password" autocomplete="current-password" [(ngModel)]="formData.password" required
                 class="input-field w-full" placeholder="Mot de passe">
        </div>
      </div>

      <div>
        <button type="submit" [disabled]="isLoading()"
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all disabled:opacity-70 disabled:cursor-not-allowed">
          @if (isLoading()) {
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Chargement...
          } @else {
            {{ isLogin() ? 'Se connecter' : "S'inscrire" }}
          }
        </button>
      </div>
    </form>
  </div>
</div>
